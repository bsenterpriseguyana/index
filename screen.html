<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMG App Purchase</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="icon" type="image/png" href="images/logo.png"> 
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="mmg-card">
    <div class="logo-wrapper">
      <div class="mmg-logo">
          <img src="images/screen.png" alt="Dual Camera Pro logo" height="100px" width="100px" />
        <div class="logo-text">Split Screen Browser For TV Pro</div>
      </div>
    </div>
    <div class="headline">
      <h2>Get the App</h2>
    </div>

    <div class="payment-panel">
      <div class="info-block">
        <div class="label">
          <i class="fas fa-mobile-alt"></i> MMG payment
        </div>
        <div class="value">
          $3,000 <span style="font-size: 1rem; font-weight: 400; color: #cfcfcf;">GYD</span>
        </div>
        <div class="small-note">
          <i class="fas fa-phone-alt"></i> +592-621-7357
        </div>
        <div class="small-note" style="color: #d4af37; margin-top: 0.25rem;">
          <i class="fas fa-check-circle"></i> Send to MMG
        </div>
      </div>

      <div class="info-block">
        <div class="label">
          <i class="fab fa-whatsapp"></i> Send image via WhatsApp
        </div>
        <div class="value">
          <i class="fab fa-whatsapp" style="color: #25D366;"></i> +592-650-1624
        </div>
        <div class="small-note">
          <i class="fas fa-image"></i> Send payment screenshot
        </div>
        <div class="small-note" style="color: #d4af37; margin-top: 0.25rem;">
          <i class="fas fa-download"></i> Receive download link valid for 24 hours only
        </div>
      </div>
    </div>

    <div class="hours-badge">
      <span>
        <i class="far fa-clock"></i> Monday–Friday · 9:00 AM – 3:00 PM
      </span>
    </div>

    <div class="back-container">
      <a href="index.html" class="back-button">
        <i class="fas fa-arrow-left"></i> Back to main
      </a>
    </div>
  </div>
</body>
</html>
